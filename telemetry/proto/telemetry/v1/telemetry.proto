syntax = "proto3";

package telemetry.v1;

// Класс результата анализа данных радара.
enum DetectionClass {
  // Класс не указан или неизвестен.
  DETECTION_CLASS_UNSPECIFIED = 0;
  // В зоне радара нет обнаруженных целей.
  DETECTION_CLASS_EMPTY = 1;
  // Обнаружен движущийся человек.
  DETECTION_CLASS_MOVING = 2;
  // Обнаружен неподвижный человек (например, по дыханию).
  DETECTION_CLASS_STATIONARY = 3;
  // Обнаружена помеха, например вентилятор, шторы или животное.
  DETECTION_CLASS_INTERFERENCE = 4;
}

// Географическая координата WGS-84 в градусах.
message GeoPoint {
  // Широта в диапазоне [-90, 90]: отрицательное значение — южная,
  // положительное — северная.
  double lat = 1;
  // Долгота в диапазоне [-180, 180]: отрицательное значение — западная,
  // положительное — восточная.
  double lon = 2;
}

// Одна цель, отслеживаемая радаром в момент формирования снимка.
message Track {
  // Локальный идентификатор трека, сохраняющийся, пока цель видна.
  uint32 id = 1;
  // Расстояние от радара до цели, метры; неотрицательное значение.
  float distance_m = 2;
  // Угол относительно оси радара, градусы; положительный — по часовой стрелке.
  float angle_deg = 3;
  // Модуль скорости цели, метры в секунду; неотрицательное значение.
  float speed_mps = 4;
  // Признак подтверждения, что цель является человеком.
  bool confirmed = 5;
  // Класс обнаружения; имеет смысл для подтверждённых целей.
  DetectionClass detection_class = 6;
  // Доля кадров, в которых цель была видна, диапазон 0..1.
  float hit_ratio = 7;
}

// Полный снимок телеметрии устройства.
// Устройство периодически отправляет это сообщение серверу. Каждое сообщение
// описывает актуальное состояние целиком, а не набор изменений относительно
// предыдущего сообщения. Идентификатор устройства назначает сервер для TCP-
// подключения и в этом контракте не передаётся.
message Telemetry {
  // Версия прошивки устройства.
  uint32 firmware_version = 1;
  // Время с момента включения устройства, секунды.
  uint32 uptime_s = 2;

  // Признак того, что радар передаёт данные.
  bool radar_ok = 3;
  // Последний класс результата анализа данных радара.
  DetectionClass detection_class = 4;
  // Вероятность присутствия человека, диапазон 0..1.
  float person_probability = 5;

  // Координаты устройства WGS-84; отсутствие поля означает отсутствие GPS-фиксации.
  GeoPoint position = 6;
  // Число спутников, используемых GPS-приёмником.
  uint32 satellites = 7;
  // Геометрический фактор точности GPS (HDOP), неотрицательное значение;
  // отсутствие означает, что значение неизвестно.
  optional float hdop = 8;

  // Признак достоверности курса. Если true, heading_deg должен быть указан;
  // если false, heading_deg не следует использовать.
  bool heading_valid = 9;
  // Азимут направления радара от истинного севера, градусы в диапазоне [0, 360);
  // применим при heading_valid=true.
  optional float heading_deg = 10;

  // Уровень сигнала Wi-Fi, дБм.
  int32 rssi_dbm = 11;
  // Число подтверждённых людей в зоне радара на момент снимка.
  uint32 target_count = 12;

  // Текущий полный список отслеживаемых радаром целей; до 6 элементов.
  // Пустой список означает, что целей сейчас нет.
  repeated Track tracks = 13;
  // Признак того, что радар в данный момент запоминает фон.
  bool learning_background = 14;
  // Число ячеек радара, помеченных как фон.
  uint32 background_cells = 15;

  // Признак активной тревоги в момент формирования снимка.
  // Это состояние, а не гарантированное событие: короткие тревоги между
  // периодическими отправками могут быть не замечены сервером.
  bool alarm_active = 16;
}
