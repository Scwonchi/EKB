window_approach_node:
  ros__parameters:
    # ---- откуда кадры ----
    # http    — веб-камера на второй Raspberry Pi (там запущен webcam_server.py)
    # service — штатная камера ровера (сервис get_frame), topic — её CompressedImage
    frame_source: http
    http_url: http://rover-cam.local:8080/frame.jpg   # адрес второй Raspberry Pi — ВПИСАТЬ
    http_timeout_s: 0.5
    max_frame_age_s: 0.5              # кадр старше — не для управления
    get_frame_service: /get_frame
    image_topic: /image_raw/compressed
    odom_topic: /odom
    cmd_vel_topic: /cmd_vel_nav       # через twist_mux: ручное управление перебивает
    rate_hz: 10.0
    publish_debug: true
    debug_rate_hz: 3.0

    # ---- камера: где стоит (ИЗМЕРИТЬ рулеткой) ----
    camera_x_m: 0.05                  # объектив впереди центра ровера, м
    camera_y_m: 0.0                   # левее центра, м
    camera_z_m: 0.45                  # высота объектива над полом, м

    # ---- камера: объектив ----
    lens_model: pinhole               # pinhole — веб-камера; ideal / calibrated — «рыбий глаз» ровера
    camera_hfov_deg: 70.0             # угол обзора по горизонтали (~/calibrate)
    camera_pitch_deg: 30.0            # наклон вверх, ° (~/calibrate при заданном window_bottom_m)
    # только для «рыбьего глаза»:
    lens_fov_deg: 180.0               # угол обзора круга изображения (ideal)
    lens_circle_cx: 0.0               # круг изображения, px; 0 — по центру кадра (lens_calib --circle)
    lens_circle_cy: 0.0
    lens_circle_r: 0.0
    lens_calib_file: ''               # calibrated: файл lens_calib по шахматной доске
    rect_width: 800                   # выпрямленный кадр
    rect_height: 600
    rect_hfov_deg: 110.0
    rect_cy_frac: 0.75
    calib_distance_m: 1.5             # для ~/calibrate: от объектива до плоскости окна, м

    # ---- окно (ИЗМЕРИТЬ на площадке) ----
    window_width_m: 0.85              # внешний размер красной рамки по горизонтали (~85 см — ИЗМЕРИТЬ)
    window_height_m: 0.70             #                  по вертикали (~70 см) — по нему расстояние
    window_frame_m: 0.05              # ширина красной планки
    window_bottom_m: 0.85             # низ рамки над полом (центр на 1,2 м); 0 — не проверять точно
    window_bottom_min_m: 0.3          # окно не ниже этого — отсекает красное на полу
    window_bottom_tol_m: 0.15
    window_width_tol: 0.35

    # ---- подъезд ----
    stop_distance_m: 0.8              # остановка: от центра ровера до плоскости окна, м (кейс: не дальше 1 м)
    tol_xy_m: 0.05                    # допуск положения, м
    tol_yaw_deg: 3.0                  # допуск угла, °
    settle_s: 0.5
    k_x: 0.8
    k_y: 1.0
    k_yaw: 1.5
    max_vx: 0.2                       # м/с
    max_vy: 0.2                       # м/с (бок, меканум)
    max_wz: 0.6                       # рад/с
    min_v: 0.03
    lost_hold_s: 1.0
    blind_finish_m: 1.3               # ближе этого и выровнен — доводка по одометрии, если окно ушло из кадра
    blind_axis_m: 0.1
    blind_yaw_deg: 10.0
    blind_max_s: 10.0
    backoff_v: 0.08
    backoff_s: 3.0
    look_blend_m: 0.4                 # дальше от оси окна — смотреть на центр окна, ближе — по нормали
    search_wz: 0.35
    search_timeout_s: 25.0            # поиск поворотом на месте не дольше
    timeout_s: 90.0                   # вся попытка не дольше
    smoothing: 0.5

    # ---- красный в HSV OpenCV (H 0..180, два участка вокруг 0) ----
    red_h_low1: 0
    red_h_high1: 10
    red_h_low2: 165
    red_h_high2: 180
    red_s_min: 90
    red_v_min: 60
    red_min_area_frac: 0.001
    red_min_hole_frac: 0.15
    red_max_aspect: 3.0
    red_require_hole: true
    red_morph_px: 3
