<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" width="920" height="600" font-family="Arial, sans-serif" font-size="13">
  <title>Вариант Б: ESP32-S3 без камеры</title>
  <rect width="920" height="600" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold" fill="#1d2329">Вариант Б: ESP32-S3 без камеры</text>
  <text x="20" y="52" fill="#5b6570">ESP32-S3 DevKitC / YD-ESP32-S3 + радар LD2450 + гироскоп MPU-6050 + компас по желанию; плата — hardware/scout_carrier</text>
  <rect x="20" y="85" width="150" height="70" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
  <text x="95" y="113" text-anchor="middle" font-weight="bold">LiPo 1S 3,7 В</text>
  <text x="95" y="133" text-anchor="middle" fill="#5b6570">300–500 мА·ч</text>
  <rect x="215" y="85" width="165" height="70" rx="8" fill="#fff4e6" stroke="#d9480f" stroke-width="2"/>
  <text x="297" y="110" text-anchor="middle" font-weight="bold">Повышающий</text>
  <text x="297" y="128" text-anchor="middle" font-weight="bold">3,7 → 5 В, ≥ 1 А</text>
  <text x="297" y="146" text-anchor="middle" fill="#5b6570" font-size="11">+ 470 мкФ на выходе</text>
  <line x1="170" y1="107" x2="215" y2="107" stroke="#d9480f" stroke-width="3"/>
  <line x1="170" y1="137" x2="215" y2="137" stroke="#1d2329" stroke-width="3"/>
  <rect x="330" y="230" width="240" height="290" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="450" y="256" text-anchor="middle" font-weight="bold" font-size="15">ESP32-S3 Dev Module</text>
  <text x="450" y="274" text-anchor="middle" fill="#5b6570" font-size="12">без камеры: тревога без фото</text>
  <g font-size="12">
    <text x="342" y="306">5V</text>
    <text x="342" y="336">GND</text>
    <text x="342" y="366">3V3</text>
    <text x="558" y="306" text-anchor="end">GPIO13 (RX)</text>
    <text x="558" y="336" text-anchor="end">GPIO14 (TX)</text>
    <text x="558" y="396" text-anchor="end">GPIO18 (SDA)</text>
    <text x="558" y="426" text-anchor="end">GPIO17 (SCL)</text>
    <text x="342" y="470" fill="#5b6570">GPIO48 — RGB-светодиод (бывает 38)</text>
    <text x="342" y="488" fill="#5b6570">BOOT — старт / калибровка компаса</text>
    <text x="342" y="506" fill="#5b6570">USB — прошивка, монитор порта</text>
  </g>
  <rect x="660" y="230" width="230" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="775" y="256" text-anchor="middle" font-weight="bold" font-size="15">Радар LD2450</text>
  <text x="775" y="274" text-anchor="middle" fill="#5b6570" font-size="12">24 ГГц, 256000 бод</text>
  <g font-size="12">
    <text x="672" y="306">TX</text>
    <text x="672" y="336">RX</text>
    <text x="878" y="306" text-anchor="end">5V</text>
    <text x="878" y="336" text-anchor="end">GND</text>
  </g>
  <rect x="660" y="380" width="230" height="120" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="775" y="406" text-anchor="middle" font-weight="bold" font-size="15">Гироскоп MPU-6050</text>
  <text x="775" y="424" text-anchor="middle" fill="#5b6570" font-size="12">GY-521, адрес 0x68</text>
  <g font-size="12">
    <text x="672" y="456">SDA</text>
    <text x="672" y="482">SCL</text>
    <text x="878" y="456" text-anchor="end">VCC 3V3</text>
    <text x="878" y="482" text-anchor="end">GND</text>
  </g>
  <line x1="570" y1="302" x2="668" y2="302" stroke="#2f9e44" stroke-width="2.5"/>
  <line x1="570" y1="332" x2="668" y2="332" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="6 3"/>
  <polyline points="570,392 615,392 615,452 668,452" fill="none" stroke="#7048e8" stroke-width="2.5"/>
  <polyline points="570,422 600,422 600,478 668,478" fill="none" stroke="#7048e8" stroke-width="2.5" stroke-dasharray="6 3"/>
  <polyline points="380,107 405,107 405,200 310,200 310,302 330,302" fill="none" stroke="#d9480f" stroke-width="3"/>
  <polyline points="405,200 905,200 905,302 882,302" fill="none" stroke="#d9480f" stroke-width="3"/>
  <text x="650" y="194" text-anchor="middle" font-size="11" fill="#d9480f">+5 В: плата 5V и радар 5V</text>
  <polyline points="380,137 395,137 395,215 300,215 300,332 330,332" fill="none" stroke="#1d2329" stroke-width="3"/>
  <polyline points="395,215 913,215 913,332 882,332" fill="none" stroke="#1d2329" stroke-width="3"/>
  <polyline points="913,332 913,478 882,478" fill="none" stroke="#1d2329" stroke-width="3"/>
  <text x="500" y="229" text-anchor="middle" font-size="11">общий GND</text>
  <polyline points="330,362 290,362 290,560 897,560 897,452 882,452" fill="none" stroke="#c2255c" stroke-width="2.5"/>
  <text x="600" y="576" text-anchor="middle" font-size="11" fill="#c2255c">3V3 с платы на гироскоп; компас (если есть) — параллельно гироскопу</text>
  <g font-size="12" fill="#1d2329">
    <text x="20" y="250" font-weight="bold">Монтаж</text>
    <text x="20" y="274">• гироскоп — жёстко к модулю,</text>
    <text x="20" y="290">  в любом положении</text>
    <text x="20" y="310">• при включении 2 с</text>
    <text x="20" y="326">  не двигать (калибровка)</text>
    <text x="20" y="346">• плата: «ESP32S3 Dev Module»</text>
    <text x="20" y="366">• для стенда, наземного</text>
    <text x="20" y="382">  датчика или носителя</text>
    <text x="20" y="398">  побольше</text>
  </g>
</svg>
